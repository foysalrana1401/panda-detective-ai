
name: Panda Detective Animation Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Animation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Build Animation
        run: python studio.py

      - name: Upload Finished Episode
        uses: actions/upload-artifact@v4
        with:
          name: Panda-Detective-Animation
          path: studio_output/
          retention-days: 7

