
name: Panda Detective Video Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -r requirements.txt

      - name: Build video
        run: |
          python main.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: Panda-Detective-Video
          path: output/
          retention-days: 7
